services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderlens}
      POSTGRES_DB: ${POSTGRES_DB:-tenderlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderlens -d tenderlens"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: tenderlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: tenderlens-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/tenderlens123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: tenderlens-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tenderlens-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:5173
      - DATABASE_URL=postgresql://tenderlens:tenderlens@postgres:5432/tenderlens
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=tenderlens123
      - NEO4J_DATABASE=neo4j
      - JWT_SECRET=change-me-in-production
      - JWT_REFRESH_SECRET=change-me-too-in-production
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - BCRYPT_ROUNDS=12
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - server-uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: tenderlens-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  server-uploads:
